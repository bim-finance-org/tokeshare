[workspace]
resolver = "2"
members = ["contracts/*"]

[workspace.dependencies]
soroban-sdk = "26"

# Release profile tuned for small, deterministic Wasm contracts.
# overflow-checks = true makes arithmetic overflow panic instead of wrapping —
# essential for a contract that moves funds.
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
